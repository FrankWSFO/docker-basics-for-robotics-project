version: '3'
services:
  fastbot-real:
    image: frankwsfo/fdw-cp22:fastbot-ros2-real    
    container_name: fastbot-ros2-real
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=1
      - CYCLONEDDS_URI=file:///cyclonedds_husarnet.xml
    volumes:
      - /var/lib/theconstruct.rrl/cyclonedds_husarnet.xml:/cyclonedds_husarnet.xml:ro
    network_mode: host
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/lslidar:/dev/lslidar
      - /dev/video0:/dev/video0
    restart: always
  fastbot-real-slam:
    image: frankwsfo/fdw-cp22:fastbot-ros2-real-slam
    container_name: fastbot-ros2-real-slam
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=1
      - CYCLONEDDS_URI=file:///cyclonedds_husarnet.xml
    volumes:
      - /var/lib/theconstruct.rrl/cyclonedds_husarnet.xml:/cyclonedds_husarnet.xml:ro
    network_mode: host
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/lslidar:/dev/lslidar
      - /dev/video0:/dev/video0
    restart: always
    # depends_on:
    #   - fastbot-real
