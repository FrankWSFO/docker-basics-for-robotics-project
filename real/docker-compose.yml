version: '2.4'
services:
  fastbot-real:
    image: frankwsfo/fdw-cp22:fastbot-ros2-real    
    container_name: fastbot-ros2-real
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=1
      - CYCLONEDDS_URI=file:///cyclonedds_husarnet.xml
    volumes:
      - /var/lib/theconstruct.rrl/cyclonedds_husarnet.xml:/cyclonedds_husarnet.xml:ro
    network_mode: host
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/lslidar:/dev/lslidar
      - /dev/video0:/dev/video0
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'source /opt/ros/humble/setup.bash && ros2 topic list | grep -q /fastbot/scan'"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s
  fastbot-real-slam:
    image: frankwsfo/fdw-cp22:fastbot-ros2-real-slam
    container_name: fastbot-ros2-real-slam
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=1
      - CYCLONEDDS_URI=file:///cyclonedds_husarnet.xml
    volumes:
      - /var/lib/theconstruct.rrl/cyclonedds_husarnet.xml:/cyclonedds_husarnet.xml:ro
    network_mode: host
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/lslidar:/dev/lslidar
      - /dev/video0:/dev/video0
    restart: always
    # depends_on:
    #   - fastbot-real
    depends_on:
      fastbot-real:
        condition: service_healthy
